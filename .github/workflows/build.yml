name: Windows VST3
on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Metric dependencies
        run: python -m pip install -r requirements-metrics.txt
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 2>&1 | Tee-Object -Variable configureLog
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $message = (($configureLog | Select-Object -Last 45) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=CMake configure::$message"
            exit $result
          }
      - uses: actions/checkout@v5
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          submodules: recursive
          path: _validator-sdk
      - name: Build and validate Debug before Release
        shell: pwsh
        run: |
          cmake -S _validator-sdk -B validator-build -G "Visual Studio 17 2022" -A x64 -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build validator-build --config Debug --target validator --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          function Fail-WithLog($file, $phase) {
            $lines = Get-Content $file
            $details = @($lines | Select-String -Pattern 'error|fatal|FAILED|Assertion|Exception|Timeout|checkpoint|PASS:|RGBA|Native|Gesture|watchdog|SHUTDOWN' | Select-Object -Last 100) + @($lines | Select-Object -Last 20)
            $message = (($details | ForEach-Object { "$_" }) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=${phase}::$message"
            exit 1
          }
          cmake --build build --config Debug --parallel 2 2>&1 | Tee-Object debug-build.log
          if ($LASTEXITCODE -ne 0) { Fail-WithLog debug-build.log 'Debug build' }
          try {
            & ./scripts/Run-Lifecycle-Windows.ps1 -Executable build/EditorGestureLifetime_artefacts/Debug/PlateLifetime.exe 2>&1 | Tee-Object debug-lifecycle.log
          } catch {
            $_ | Out-String | Add-Content debug-lifecycle.log
            Fail-WithLog debug-lifecycle.log 'Native lifecycle watchdog'
          }
          ctest --test-dir build -C Debug --output-on-failure --stop-on-failure 2>&1 | Tee-Object debug-tests.log
          if ($LASTEXITCODE -ne 0) { Fail-WithLog debug-tests.log 'Debug tests' }
          $validator = (Get-ChildItem validator-build -Recurse -Filter validator.exe | Select-Object -First 1).FullName
          & $validator (Resolve-Path 'build/Plate140_artefacts/Debug/VST3/PLATE 140.vst3').Path 2>&1 | Tee-Object debug-validator.log
          if ($LASTEXITCODE -ne 0) { Fail-WithLog debug-validator.log 'Debug validator' }
          if (Select-String -Path debug-*.log -Pattern 'JUCE Assertion failure' -Quiet) { throw 'JUCE assertion in Debug logs' }
      - name: Save Debug diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PLATE140-Debug-Logs
          path: |
            debug-*.log
            debug-*.dmp
            plate-lifecycle-hang.dmp
            build/**/*.pdb
          if-no-files-found: ignore
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Official validator Release
        shell: pwsh
        run: |
          cmake --build validator-build --config Release --target validator --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $validator = (Get-ChildItem validator-build -Recurse -Filter validator.exe | Where-Object FullName -Match 'Release' | Select-Object -First 1).FullName
          & $validator (Resolve-Path 'build/Plate140_artefacts/Release/VST3/PLATE 140.vst3').Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Preset and floating-browser integration
        shell: pwsh
        run: |
          $env:PLATE140_PRESET_HOME = Join-Path $env:RUNNER_TEMP ('plate140-tests-' + [guid]::NewGuid())
          $preview = (Resolve-Path build/PlatePreview_artefacts/Release/PlatePreview.exe).Path
          $snapshot = Join-Path $env:RUNNER_TEMP 'plate140-preview.png'
          $run = Start-Process -FilePath $preview -ArgumentList $snapshot -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw 'Preset integration failed' }
          if (!(Test-Path $snapshot)) { throw 'Native editor snapshot missing' }
      - name: Actual VST3 playback and removal regression
        shell: pwsh
        run: |
          $env:PLATE140_TEST_VST3 = (Get-ChildItem build/Plate140_artefacts/Release/VST3 -Filter *.vst3 | Select-Object -First 1).FullName
          $env:PLATE140_PRESET_HOME = Join-Path $env:RUNNER_TEMP ('plate140-removal-' + [guid]::NewGuid())
          $hostTest = (Resolve-Path build/PlateRemovalHost_artefacts/Release/PlateRemovalHost.exe).Path
          $run = Start-Process -FilePath $hostTest -PassThru -RedirectStandardOutput removal-stdout.log -RedirectStandardError removal-stderr.log
          if (!$run.WaitForExit(90000)) { $run.Kill(); Get-Content removal-stdout.log,removal-stderr.log; throw 'VST3 removal blocked the host message thread' }
          $run.WaitForExit()
          Get-Content removal-stdout.log,removal-stderr.log
          if ($run.ExitCode -ne 0) {
            $diag = ((Get-Content removal-stdout.log,removal-stderr.log | Select-Object -Last 40) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=VST3 removal::$diag"
            throw "VST3 removal regression failed: $($run.ExitCode)"
          }
      - name: Save removal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PLATE140-Removal-Logs
          path: |
            removal-*.log
            teardown-*.log
          if-no-files-found: ignore
      - name: Save compiled editor screenshot
        uses: actions/upload-artifact@v4
        with:
          name: PLATE140-Windows-UI
          path: ${{ runner.temp }}/plate140-preview.png
      - name: pluginval level 10
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath validator
          $validator = (Get-ChildItem validator -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          $bundle = (Get-ChildItem build/Plate140_artefacts/Release/VST3 -Filter *.vst3 | Select-Object -First 1).FullName
          & $validator --strictness-level 10 --sample-rates 44100,48000,96000,192000 --block-sizes 32,64,128,256,512,1024 --validate $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify Windows AMD64 binaries
        shell: pwsh
        run: |
          $binary = (Get-ChildItem build/Plate140_artefacts/Release/VST3 -Recurse -File -Filter *.vst3 | Select-Object -First 1).FullName
          $bytes = [IO.File]::ReadAllBytes($binary)
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $offset) -ne 0x4550 -or [BitConverter]::ToUInt16($bytes, $offset+4) -ne 0x8664 -or [BitConverter]::ToUInt16($bytes, $offset+24) -ne 0x20b) { throw 'Expected PE32+ AMD64 VST3' }
          git rev-parse HEAD | Set-Content BUILD-COMMIT.txt
          Copy-Item (Join-Path $env:RUNNER_TEMP 'plate140-preview.png') rack-ui.png
          @("Commit: $env:GITHUB_SHA",'Windows Server 2022, MSVC x64. Debug build/ctest/official Steinberg validator: PASS. Release build/ctest/native preset integration/VST3 removal/pluginval level 10: PASS.','Studio One 8/8.4, Reaper, physical mixed DPI and real listening: NOT TESTED.') | Set-Content WINDOWS-VALIDATION.txt
          Compress-Archive -Path build/Plate140_artefacts/Release/VST3,build/Plate140_artefacts/Release/Standalone,Presets/PLATE140-100,README.md,LICENSES.md,BUILD-COMMIT.txt,WINDOWS-VALIDATION.txt,rack-ui.png,build/compatible-graphics.txt -DestinationPath PLATE140-Windows-x64.zip
          $symbols = Get-ChildItem build -Recurse -Filter *.pdb | Where-Object FullName -Match 'Debug'
          $debugStage = Join-Path $env:RUNNER_TEMP 'plate140-debug-package'
          New-Item -ItemType Directory -Force $debugStage | Out-Null
          Copy-Item build/Plate140_artefacts/Debug/VST3 $debugStage -Recurse
          Copy-Item BUILD-COMMIT.txt $debugStage
          $buildRoot = (Resolve-Path build).Path
          foreach ($symbol in $symbols) {
            $relative = [IO.Path]::GetRelativePath($buildRoot, $symbol.FullName)
            $destination = Join-Path $debugStage (Join-Path 'symbols' $relative)
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item $symbol.FullName $destination
          }
          Compress-Archive -Path "$debugStage/*" -DestinationPath PLATE140-Windows-x64-Debug.zip
          Get-FileHash PLATE140-Windows-x64*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PLATE140-Windows-x64
          path: |
            PLATE140-Windows-x64.zip
            PLATE140-Windows-x64-Debug.zip
            SHA256SUMS.txt
            BUILD-COMMIT.txt
            WINDOWS-VALIDATION.txt
            debug-*.log

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/fix-presets-audibility' && contains(github.event.head_commit.message, '[release-preview]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PLATE140-Windows-x64
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.0-dev.2' }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" PLATE140-Windows-x64.zip PLATE140-Windows-x64-Debug.zip SHA256SUMS.txt BUILD-COMMIT.txt --target "$RELEASE_COMMIT" --prerelease --title "PLATE 140 Windows x64 ($RELEASE_TAG)" --notes "Development VST3 and Standalone Windows x64: reference-panel UI, corrected physical knob scales, all 20 controls audited through audio, 100 individually voiced presets (minimum tonal/decay contrast across all 4,950 pairs). Debug/Release tests, native lifecycle, official validator and pluginval level 10 passed. Studio One 8, Reaper and listening validation remain pending."

  open-pr:
    needs: build
    if: github.ref == 'refs/heads/fix-presets-audibility'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Open requested review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh pr list --head fix-presets-audibility --base main --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "::notice title=Pull request::$existing"
          else
            set +e
            gh pr create --base main --head fix-presets-audibility --title "Corrige painel EMT, mapeamento dos controles e contraste dos 100 presets" --body-file docs/PR_DESCRIPTION.md > pr-result.txt 2>&1
            result=$?
            set -e
            if [ "$result" -ne 0 ]; then
              message=$(cat pr-result.txt | sed 's/%/%25/g' | tr '\n' ' ')
              echo "::error title=Pull request creation::$message"
              exit "$result"
            fi
            echo "::notice title=Pull request::$(cat pr-result.txt)"
          fi
