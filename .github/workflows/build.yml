name: Windows VST3
on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 2>&1 | Tee-Object -Variable configureLog
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $message = (($configureLog | Select-Object -Last 45) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=CMake configure::$message"
            exit $result
          }
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -Variable buildLog
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $message = (($buildLog | Select-Object -Last 60) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows build::$message"
            exit $result
          }
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Host lifecycle regression
        shell: pwsh
        run: |
          $preview = (Resolve-Path build/PlatePreview_artefacts/Release/PlatePreview.exe).Path
          $run = Start-Process -FilePath $preview -ArgumentList '--host-lifecycle' -PassThru -RedirectStandardOutput lifecycle-stdout.log -RedirectStandardError lifecycle-stderr.log
          if (!$run.WaitForExit(60000)) { $run.Kill(); throw 'Host lifecycle callback timed out' }
          $run.WaitForExit()
          Get-Content lifecycle-stdout.log,lifecycle-stderr.log
          if ($run.ExitCode -ne 0) { throw "Host lifecycle regression failed: $($run.ExitCode)" }
      - name: Preset and floating-browser integration
        shell: pwsh
        run: |
          $env:PLATE140_PRESET_HOME = Join-Path $env:RUNNER_TEMP ('plate140-tests-' + [guid]::NewGuid())
          $preview = (Resolve-Path build/PlatePreview_artefacts/Release/PlatePreview.exe).Path
          $snapshot = Join-Path $env:RUNNER_TEMP 'plate140-preview.png'
          $run = Start-Process -FilePath $preview -ArgumentList $snapshot -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw 'Preset integration failed' }
          if (!(Test-Path $snapshot)) { throw 'Native editor snapshot missing' }
      - name: Editor and browser teardown while playing
        shell: pwsh
        run: |
          $env:PLATE140_PRESET_HOME = Join-Path $env:RUNNER_TEMP ('plate140-teardown-' + [guid]::NewGuid())
          $preview = (Resolve-Path build/PlatePreview_artefacts/Release/PlatePreview.exe).Path
          $run = Start-Process -FilePath $preview -ArgumentList '--editor-teardown' -PassThru -RedirectStandardOutput teardown-stdout.log -RedirectStandardError teardown-stderr.log
          if (!$run.WaitForExit(90000)) { $run.Kill(); Get-Content teardown-stdout.log,teardown-stderr.log; throw 'Editor/browser removal blocked the UI thread' }
          $run.WaitForExit()
          Get-Content teardown-stdout.log,teardown-stderr.log
          if ($run.ExitCode -ne 0) {
            $diag = ((Get-Content teardown-stdout.log,teardown-stderr.log | Select-Object -Last 40) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Editor teardown::$diag"
            throw "Editor teardown regression failed: $($run.ExitCode)"
          }
      - name: Actual VST3 playback and removal regression
        shell: pwsh
        run: |
          $env:PLATE140_TEST_VST3 = (Get-ChildItem build/Plate140_artefacts/Release/VST3 -Filter *.vst3 | Select-Object -First 1).FullName
          $env:PLATE140_PRESET_HOME = Join-Path $env:RUNNER_TEMP ('plate140-removal-' + [guid]::NewGuid())
          $hostTest = (Resolve-Path build/PlateRemovalHost_artefacts/Release/PlateRemovalHost.exe).Path
          $run = Start-Process -FilePath $hostTest -PassThru -RedirectStandardOutput removal-stdout.log -RedirectStandardError removal-stderr.log
          if (!$run.WaitForExit(90000)) { $run.Kill(); Get-Content removal-stdout.log,removal-stderr.log; throw 'VST3 removal blocked the host message thread' }
          $run.WaitForExit()
          Get-Content removal-stdout.log,removal-stderr.log
          if ($run.ExitCode -ne 0) {
            $diag = ((Get-Content removal-stdout.log,removal-stderr.log | Select-Object -Last 40) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=VST3 removal::$diag"
            throw "VST3 removal regression failed: $($run.ExitCode)"
          }
      - name: Save removal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PLATE140-Removal-Logs
          path: |
            removal-*.log
            teardown-*.log
          if-no-files-found: ignore
      - name: Save compiled editor screenshot
        uses: actions/upload-artifact@v4
        with:
          name: PLATE140-Windows-UI
          path: ${{ runner.temp }}/plate140-preview.png
      - name: pluginval level 10
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath validator
          $validator = (Get-ChildItem validator -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          $bundle = (Get-ChildItem build/Plate140_artefacts/Release/VST3 -Filter *.vst3 | Select-Object -First 1).FullName
          & $validator --strictness-level 10 --sample-rates 44100,48000,96000,192000 --block-sizes 32,64,128,256,512,1024 --validate $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          git rev-parse HEAD | Set-Content BUILD-INFO.txt
          Add-Content BUILD-INFO.txt 'Embedded photographic rack panel; UI screenshot included.'
          Copy-Item (Join-Path $env:RUNNER_TEMP 'plate140-preview.png') rack-ui.png
          Compress-Archive -Path build/Plate140_artefacts/Release/VST3,build/Plate140_artefacts/Release/Standalone,Presets/PLATE140-100,README.md,LICENSES.md,BUILD-INFO.txt,rack-ui.png -DestinationPath PLATE140-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PLATE140-Windows-x64
          path: PLATE140-Windows-x64.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PLATE140-Windows-x64
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" PLATE140-Windows-x64.zip --verify-tag --prerelease --title "PLATE 140 Windows x64 ($RELEASE_TAG)" --notes "Development VST3 and Standalone Windows x64 build, including 100 mapped presets. Build, DSP/preset integration and pluginval level 10 must pass before this package is published. Studio One validation remains pending."
